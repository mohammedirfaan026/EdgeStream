# EdgeStream AI — Edge Server (Nginx)
# Nginx reverse proxy with HLS segment disk caching
#
# Laptop B: 192.168.1.20
# Origin  : 192.168.1.10:8000 (Laptop A)
#
# UPDATE the proxy_pass IP below to match your actual Laptop A IP.
#
# Tested with Nginx 1.24+ and 1.27 Alpine (Docker).

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # ── Disk cache ────────────────────────────────────────────────────────────
    #   keys_zone=edge_cache:10m  → 10 MB zone for cache keys (~80k entries)
    #   max_size=5g               → max 5 GB total cached data on disk
    #   inactive=24h              → evict entries not accessed in 24 hours
    #   use_temp_path=off         → write directly to cache dir (avoids extra copy)
    proxy_cache_path /var/cache/nginx/edgestream
        levels=1:2
        keys_zone=edge_cache:10m
        max_size=5g
        inactive=24h
        use_temp_path=off;

    # ── Custom log format: includes cache status ───────────────────────────────
    # $upstream_cache_status = HIT | MISS | EXPIRED | BYPASS | -
    log_format edgestream_log
        '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
        '"$upstream_cache_status" ${request_time}s';

    access_log /var/log/nginx/access.log edgestream_log;

    # ── Upstream — Laptop A origin server ─────────────────────────────────────
    upstream origin {
        server 192.168.1.10:8000;   # ← UPDATE to real Laptop A IP
        keepalive 8;
    }

    server {
        listen 80;
        server_name _;              # Accept requests for any hostname / IP

        # ── CORS headers — required for browser HLS playback ──────────────────
        # hls.js fetches .m3u8 and .ts files with XHR/Fetch, which checks CORS.
        add_header 'Access-Control-Allow-Origin'  '*'          always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Range'      always;

        # ── Expose cache status in response header (visible in browser DevTools)
        add_header X-Cache-Status   $upstream_cache_status     always;
        add_header X-Edge-Server    "EdgeStream-Nginx"         always;

        # ── Handle OPTIONS preflight ──────────────────────────────────────────
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  '*';
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS';
            add_header 'Content-Length' '0';
            return 204;
        }

        # ── Main proxy location — all traffic forwarded to origin ──────────────
        location / {
            proxy_pass         http://origin;
            proxy_http_version 1.1;
            proxy_set_header   Connection       "";     # keep-alive to upstream
            proxy_set_header   Host             $http_host;
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;

            # ── Cache configuration ───────────────────────────────────────────
            proxy_cache        edge_cache;

            # Cache key = URI only (ignore query strings for HLS files)
            proxy_cache_key    "$uri";

            # Cache successful 200 responses for 1 day
            # Do NOT cache errors or redirects
            proxy_cache_valid  200 1d;
            proxy_cache_valid  301 302 0;
            proxy_cache_valid  any 0;

            # Serve stale cache if origin is temporarily unavailable
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

            # If multiple clients request the same uncached resource simultaneously,
            # only send ONE upstream request (lock the others until first completes)
            proxy_cache_lock   on;

            # Respect Cache-Control: no-store from the origin
            # (master.m3u8 sends no-store; this ensures it's never cached)
            proxy_cache_bypass $http_pragma;
            proxy_no_cache     $upstream_http_cache_control;
            # Note: the above two lines mean:
            #   - no-store origin header → do not cache
            #   - public max-age origin header → cache it

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
            proxy_send_timeout    10s;
        }

        # ── Health check — does not go to origin ──────────────────────────────
        location /edge-health {
            access_log off;
            return 200 '{"status":"ok","server":"edge","cache":"active"}';
            add_header Content-Type application/json always;
        }

        # ── Cache purge endpoint (manual use only) ────────────────────────────
        # Not used in normal operation — for development debugging only.
        # In production you would use nginx cache purge module.
        location /edge-cache-info {
            return 200 '{"info":"Cache at /var/cache/nginx/edgestream"}';
            add_header Content-Type application/json always;
        }
    }
}
